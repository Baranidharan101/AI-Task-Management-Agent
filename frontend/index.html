<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Task Management Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 200: '#bae0fd', 300: '#7cc7fb',
              400: '#36abf6', 500: '#0c8fe6', 600: '#0270c4', 700: '#03599f',
              800: '#074c83', 900: '#0c406e', 950: '#082849',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  
  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-sky-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
            AI Task Management Agent
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20">v2.0</span>
          </h1>
          <p class="text-xs text-slate-400">Decoupled Architecture</p>
        </div>
      </div>

      <!-- System Telemetry & Status -->
      <div class="flex items-center gap-3">
        <div id="latency-badge" class="text-xs font-mono font-bold text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2.5 py-1 rounded-full">
          &lt; 15 ms
        </div>
        <div id="api-status" class="flex items-center text-xs font-semibold text-emerald-400 bg-emerald-950/60 border border-emerald-800/80 px-3 py-1 rounded-full">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-2"></span>Connecting...
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

    <!-- Conversational Natural Language Command Bar -->
    <section class="bg-gradient-to-r from-slate-900/90 via-slate-900/60 to-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-2xl backdrop-blur-xl">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="command-input" 
            placeholder="Try: 'Remind me to prep for the marketing review next Tuesday' or 'Break down auth migration'..." 
            class="w-full pl-11 pr-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition duration-150"
          />
        </div>
        <button 
          id="command-btn" 
          class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-white text-sm font-semibold px-6 py-3 rounded-xl transition duration-150 shadow-lg shadow-brand-500/20 whitespace-nowrap flex items-center justify-center gap-2">
          <span>Send Command</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div>

      <!-- Quick Prompt Suggestion Chips -->
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-400">
        <span class="font-medium text-slate-500">Quick prompts:</span>
        <button onclick="document.getElementById('command-input').value=this.innerText; submitCommand();" class="hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 px-2.5 py-1 rounded-lg transition">Remind me to prep for marketing review next Tuesday</button>
        <button onclick="document.getElementById('command-input').value=this.innerText; submitCommand();" class="hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 px-2.5 py-1 rounded-lg transition">Break down client onboarding pipeline</button>
        <button onclick="document.getElementById('command-input').value=this.innerText; submitCommand();" class="hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 px-2.5 py-1 rounded-lg transition">Urgent: Fix production SSL cert error tomorrow</button>
      </div>
    </section>

    <!-- Morning Briefing Banner (Collapsible/Dynamic) -->
    <section id="briefing-banner" class="hidden bg-slate-900/80 border border-amber-500/30 rounded-2xl p-4 shadow-xl backdrop-blur-md">
      <div id="briefing-content"></div>
    </section>

    <!-- Task Board Grid (Kanban Columns) -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
      
      <!-- Pending Column -->
      <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <h2 class="font-bold text-sm text-slate-200">Pending</h2>
          </div>
          <span id="count-pending" class="text-xs font-mono font-bold bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0</span>
        </div>
        <div id="tasks-pending" class="space-y-3 min-h-[160px]"></div>
      </div>

      <!-- In Progress Column -->
      <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>
            <h2 class="font-bold text-sm text-slate-200">In Progress</h2>
          </div>
          <span id="count-in-progress" class="text-xs font-mono font-bold bg-sky-950/80 text-sky-400 border border-sky-800 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="tasks-in-progress" class="space-y-3 min-h-[160px]"></div>
      </div>

      <!-- Completed Column -->
      <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <h2 class="font-bold text-sm text-slate-200">Completed</h2>
          </div>
          <span id="count-completed" class="text-xs font-mono font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="tasks-completed" class="space-y-3 min-h-[160px]"></div>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    AI Task Management Agent &bull; Powered by Antigravity IDE &bull; Meets PRD v2.0 Specifications
  </footer>

  <script src="./app.js"></script>
</body>
</html>
